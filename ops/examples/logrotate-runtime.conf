# logrotate stanzas for append-only agent/serving runtime logs.
#
# Driven by a systemd USER timer (hourly), with its own state file:
#     logrotate --state ~/.local/state/logrotate/runtime.status this.conf
# Run it manually with --force (rotate now) or --debug (dry run, change nothing).
#
# ⛔ WHY copytruncate EVERYWHERE, WITHOUT EXCEPTION.
# A rename/create rotation only works if the writer reopens the path. A long-lived
# process holding an O_APPEND fd never does — it keeps writing into the now-unlinked
# inode forever, i.e. silent log loss with NO size relief. Two shapes guarantee it:
#   * fd 1+2 of a long-lived process  (`exec python ... >>"$LOG" 2>&1`)
#   * systemd's own StandardOutput=append:  (systemd holds the fd for the unit's life —
#     easy to miss, because the unit file never mentions a redirect)
# Paths whose writer reopens per record would survive either scheme; copytruncate is
# used there too so the policy has ONE rule, not two. The cost is the records written
# between the copy and the truncate — acceptable for metrics, not for anything where a
# lost record is a correctness problem.
#
# ⛔ compress IS A READER CHANGE. `name.1.gz` does not match a `*.jsonl` glob, so an
# analysis script globbing the bare name silently returns LESS DATA — no error, no
# missing-row marker, just a report that is short right after a rotation. Make every
# reader gz-aware IN THE SAME CHANGE as enabling compression. See ops/log-rotation.md §2
# for the two functions (day_files / open_day) and a window reader that spans live + gz.
#
# ⛔ NEVER DELETE. logrotate prunes only its own compressed generations past `rotate N`;
# every stanza here keeps >= 14 days. A rotation job that deletes is one somebody disables.
#
# Each stanza documents WRITER / READERS / GROWTH. Those three lines decide the stanza:
#   persistent fd?            -> copytruncate mandatory
#   programmatic readers?     -> compress needs a reader change first
# Write the inventory when you write the stanza.

# ── append-only metrics ledger, one record per monitor tick ───────────────────
# Writer:  <script>, open(path,"a") then close per record — no persistent fd.
# Readers: none in code; a `latest.json` rewritten every tick is the programmatic
#          consumer. This file is ad-hoc/interactive history only.
# Growth:  ~30 KB/record, 720 records/day => ~20 MB/day. Was 401 MB unrotated.
# History: 14 daily generations, gzip ~8.8x => steady state ~55 MB.
/path/to/monitor/status.jsonl {
    daily
    maxsize 100M
    rotate 14
    copytruncate
    compress
    compresscmd /usr/bin/gzip
    compressoptions -6
    missingok
    notifempty
    nomail
    create 0664 <user> <group>
}

# ── stdout/stderr of a LIVE long-running process ─────────────────────────────
# Writer:  fd 1+2 of a live process started as `exec python ... >>"$LOG" 2>&1`.
#          *** PERSISTENT FD — copytruncate is mandatory, not a preference ***
# Readers: none in code.
/path/to/bridge/bridge.log
/path/to/bridge/helper.log {
    daily
    maxsize 32M
    rotate 14
    copytruncate
    compress
    compresscmd /usr/bin/gzip
    compressoptions -6
    missingok
    notifempty
    nomail
}

# ── a unit's StandardOutput=append: target ───────────────────────────────────
# Writer:  systemd holds the fd for the life of the unit.
#          *** PERSISTENT FD — copytruncate is mandatory ***
# Readers: none in code (the analysis reads the writer's own per-day jsonl files).
/path/to/runner.log {
    daily
    maxsize 32M
    rotate 14
    copytruncate
    compress
    compresscmd /usr/bin/gzip
    compressoptions -6
    missingok
    notifempty
    nomail
}

# ── low-rate ops guard logs ──────────────────────────────────────────────────
# Writer:  shell guards appending `>>` from their wrappers. ~90 KB/day, unbounded.
# Readers: none in code; humans and agents grep them.
/path/to/ops/logs/*.log {
    weekly
    maxsize 32M
    rotate 12
    copytruncate
    compress
    compresscmd /usr/bin/gzip
    compressoptions -6
    missingok
    notifempty
    nomail
}

# ⛔ NOT ROTATED HERE, DELIBERATELY — the exclusions are the load-bearing entries:
#
#   <framework>/logs/{agent,errors,gateway}.log
#       The framework rotates these itself (size caps with .1/.2/.3 generations).
#       Adding logrotate would mean two rotators racing on the same path.
#
#   <dir>/{ticks,decisions}-YYYYMMDD.jsonl
#       The writer rolls per calendar day, so these are never appended to once stale
#       and logrotate has nothing useful to do with them — but nothing compresses them
#       either, so they accumulate forever. A separate step gzips day files older than
#       KEEP_DAYS (set from the widest window any consumer reads, with margin). See
#       ops/log-rotation.md §3 for that loop.
