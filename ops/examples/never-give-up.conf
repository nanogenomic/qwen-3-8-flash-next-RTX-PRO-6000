# 99-zzzz-never-give-up.conf
#
# Drop this in as:
#   ~/.config/systemd/user/<your-serving-unit>.service.d/99-zzzz-never-give-up.conf
#   systemctl --user daemon-reload
#
# ⛔ THE START LIMITER CAN PERMANENTLY STOP THE LANE THAT "MUST NEVER STOP".
#
# If StartLimitBurst x RestartSec < StartLimitIntervalSec, a fast-failing unit burns
# its whole restart budget inside the window, systemd logs "start request repeated
# too quickly", and the unit latches `failed` with nothing left to retry. That is
# strictly worse than a crash: it is a crash plus a permanent refusal to try again,
# and it is silent.
#
# Measured on the reference deployment, effective values before this drop-in:
#     StartLimitIntervalSec=600   StartLimitBurst=10   RestartSec=30   Restart=always
# Ten restarts 30s apart span 300s, INSIDE the 600s window. The lane crash-looped
# NINE times on one bad boot and survived on a margin of one.
#
# ⛔ The trap was created by making the limiter "more generous": an earlier drop-in's
# 5 x 5s = 25s in a 300s window was safe; a later one raised the burst 5 -> 10 AND
# raised RestartSec 5s -> 30s, and the second change is what pulled all ten starts
# inside the window. Two coupled numbers, each moved in the direction that sounds
# safer, made the pair unsafe.
#
# ⛔ StartLimitIntervalSec=0 DISABLES RATE LIMITING ENTIRELY. That is correct and
# intended here: with Restart=always the unit then retries forever. Forever-retrying
# is LOUD (every restart edge can fire an incident capture — see ops/observability.md)
# and SELF-HEALING the moment the underlying fault clears. A latched `failed` state is
# silent and permanent. Pick the loud one.
#
# ⛔ FILENAME SORTS LAST ON PURPOSE. Drop-ins apply in lexical order and the last
# setter of a scalar wins, so if an existing drop-in sets the limiter yours must sort
# after it ("99-zzzz-" sorts after "99-zzz-"). Verify the EFFECT, never the file:
#     systemctl --user show <unit> -p StartLimitIntervalUSec -p StartLimitBurst
# Expect StartLimitIntervalUSec=0 (or infinity, depending on systemd version). The
# burst value becomes irrelevant and may be left as it was.
#
# ⛔ StartLimitIntervalSec AND StartLimitBurst BELONG IN [Unit]. Under [Service] they
# are silently ignored, and the unit still loads:
#     $ systemd-analyze --user verify probe.service
#     probe.service:6: Unknown key name 'StartLimitIntervalSec' in section 'Service', ignoring.
#     $ echo $?
#     0
# (RefuseManualStop= is the same class: a [Unit] directive that is accepted and does
# nothing under [Service], so a unit can report Restart=always while staying
# stoppable by anyone.)
#
# ⛔ THIS CHANGES NOTHING ABOUT THE WORKLOAD. No model, flag, card, memory budget or
# ExecStart. It changes only whether systemd is allowed to give up, so it installs on
# a live lane with a daemon-reload and takes effect at the lane's NEXT start, whenever
# that happens to be. `daemon-reload` restarts nothing. Prove it changed nothing:
#     systemctl --user show <unit> -p ExecMainStartTimestamp -p NRestarts   # before
#     systemctl --user show <unit> -p ExecMainStartTimestamp -p NRestarts   # after
#
# ROLLBACK:
#     rm ~/.config/systemd/user/<unit>.service.d/99-zzzz-never-give-up.conf
#     systemctl --user daemon-reload
#
# ⛔ DO NOT apply this to a unit whose failure mode is "comes back up and corrupts
# something", or that holds an exclusive resource it cannot re-acquire cleanly. It is
# for a lane where being down is the worst outcome available.
[Unit]
StartLimitIntervalSec=0
